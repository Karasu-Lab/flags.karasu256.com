name: Flags Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/Workers/deploy-worker@v1
        with:
          mode: production
          hub-repo: Karasu-Lab/Karasu-Lab
          app-path: apps/flags.karasu256.com
          deploy-command: pnpm --filter flags.karasu256.com deploy
          preview-command: pnpm --filter flags.karasu256.com preview -- --name "{branch}"
          worker-name: flags-karasu256-com

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/Workers/deploy-worker@v1
        with:
          mode: preview
          hub-repo: Karasu-Lab/Karasu-Lab
          app-path: apps/flags.karasu256.com
          deploy-command: pnpm --filter flags.karasu256.com deploy
          preview-command: pnpm --filter flags.karasu256.com preview -- --name "{branch}"
          worker-name: flags-karasu256-com
